<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="100%" height="100%">
  <defs>
    <!-- Facet Gradients for Star (Left Blue Side) -->
    <linearGradient id="favStarBlueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="favStarBlueMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="favStarBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    
    <!-- Facet Gradients for Star (Right Orange Side) -->
    <linearGradient id="favStarOrangeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="favStarOrangeMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="favStarOrangeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Swoosh Gradients -->
    <linearGradient id="favSwooshBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="favSwooshOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Group: Star Plus Emblem -->
  <g transform="translate(10, 15) scale(0.95)">
    <!-- Inner Orange Swoosh Arc -->
    <path d="M 16,56 C 18,72 38,82 56,80 C 42,78 28,70 24,56 Z" fill="url(#favSwooshOrange)" opacity="0.95"/>

    <!-- 3D 8-Point Compass Star -->
    <polygon points="50,10 50,50 40,36" fill="url(#favStarBlueLight)"/>
    <polygon points="50,10 50,50 60,36" fill="url(#favStarOrangeLight)"/>

    <polygon points="78,22 50,50 60,36" fill="url(#favStarOrangeLight)"/>
    <polygon points="78,22 50,50 64,50" fill="url(#favStarOrangeMid)"/>

    <polygon points="90,50 50,50 64,50" fill="url(#favStarOrangeMid)"/>
    <polygon points="90,50 50,50 64,64" fill="url(#favStarOrangeDark)"/>

    <polygon points="78,78 50,50 64,64" fill="url(#favStarOrangeDark)"/>
    <polygon points="78,78 50,50 50,64" fill="url(#favStarOrangeMid)"/>

    <polygon points="50,90 50,50 50,64" fill="url(#favStarOrangeDark)"/>
    <polygon points="50,90 50,50 36,64" fill="url(#favStarBlueDark)"/>

    <polygon points="22,78 50,50 36,64" fill="url(#favStarBlueDark)"/>
    <polygon points="22,78 50,50 36,50" fill="url(#favStarBlueMid)"/>

    <polygon points="10,50 50,50 36,50" fill="url(#favStarBlueMid)"/>
    <polygon points="10,50 50,50 36,36" fill="url(#favStarBlueLight)"/>

    <polygon points="22,22 50,50 36,36" fill="url(#favStarBlueLight)"/>
    <polygon points="22,22 50,50 40,36" fill="url(#favStarBlueMid)"/>

    <!-- Outer Swoosh Orbit -->
    <path d="M 6,54 C 6,76 30,90 58,84 C 74,80 88,68 104,44 C 92,60 74,74 54,76 C 28,78 12,66 12,52 C 12,42 22,34 32,28 C 22,32 6,42 6,54 Z" fill="url(#favSwooshBlue)"/>

    <!-- Airplane Jet Ascending Top Right -->
    <g transform="translate(108, 38) rotate(32) scale(1.18)">
      <path d="M 0,-14 C 1.5,-12 2.5,-4 2.5,8 L 1,12 L -1,12 L -2.5,8 C -2.5,-4 -1.5,-12 0,-14 Z" fill="#0284C7"/>
      <path d="M 0,-2 L 13,5 L 12,8 L 0,3 L -12,8 L -13,5 Z" fill="#0369A1"/>
      <path d="M 0,8 L 6,12 L 5,14 L 0,12 L -5,14 L -6,12 Z" fill="#0284C7"/>
      <polygon points="0,-14 1.2,-2 0,4 -1.2,-2" fill="#38BDF8"/>
    </g>
  </g>
</svg>
